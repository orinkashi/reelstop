plugins { id 'com.android.application' }
android {
    // Same key for every build, so updates install over the old version.
    // The key is kept in the repo's GitHub secrets (OMAR_KEYSTORE_B64, OMAR_KEYSTORE_PASS), never in the code.
    signingConfigs {
        debug {
            if (System.getenv('OMAR_KS_PATH')) {
                storeFile file(System.getenv('OMAR_KS_PATH'))
                storePassword System.getenv('OMAR_KS_PASS')
                keyAlias 'omar'
                keyPassword System.getenv('OMAR_KS_PASS')
            }
        }
    }
    namespace 'ma.marji3.app'
    compileSdk 34
    defaultConfig { applicationId 'ma.marji3.app'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    aaptOptions { noCompress 'ttf' }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
