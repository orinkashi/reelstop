<style>
/* VOICE everyday tool, calm and precise
   IDEA the Moroccan tear-off wall calendar (ruznama): one big red date page, the month behind it
   PICTURE the torn date sheet of the selected day, with its appointments listed on it
   COLOUR white / night ink, calendar red as the one accent, five event colours
   TYPE Archivo (display numerals) + Inter
   LAYOUT laptop: date sheet left, month or week right; phone: sheet band, tabs, view, agenda */
:root{color-scheme:dark;
--bg:#0f1115;--panel:#181b21;--line:#272b33;

*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:12px;min-height:44px;padding:0 14px;font-weight:600}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left)) 96px;display:grid;gap:20px}

@media(min-width:900px){.sheet{position:sticky;top:20px}}
.sheet .top{background:var(--red);color:var(--on);padding:10px 18px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:600}
.sheet .holes{display:flex;justify-content:space-around;position:absolute;top:-7px;left:30px;right:30px}
.sheet .holes i{width:14px;height:14px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.sheet .face{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;align-items:end;padding:16px 18px 10px;border-bottom:1px dashed var(--line)}
.bignum{font:800 clamp(72px,18vw,112px)/.85 Archivo,Inter,sans-serif;letter-spacing:-.04em;color:var(--red)}
.wd{font:700 22px/1.1 Archivo,Inter,sans-serif}.mo{color:var(--mute);font-size:15px}
.agenda{padding:8px 10px 14px;display:grid;gap:6px}

.ev .bar{align-self:stretch;border-radius:4px}
.ev b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev small{color:var(--mute);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .tm{font-variant-numeric:tabular-nums;color:var(--mute);font-size:14px;white-space:nowrap;text-align:right}
.empty{color:var(--mute);padding:10px 8px;font-size:15px}
.head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h1{font:800 clamp(30px,6vw,44px)/1.05 Archivo,Inter,sans-serif;letter-spacing:-.02em;margin:0;text-transform:capitalize}
.nav{display:flex;gap:6px}.nav button{min-width:44px;padding:0 12px}
.tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.tabs button{border:0;background:none;min-height:38px;padding:0 12px;font-size:14px}
.tabs button.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);border-radius:14px;overflow:hidden}
.dow{font-size:13px;color:var(--mute);padding:8px 6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-transform:capitalize;background:var(--panel)}
.cell{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;background:var(--bg);min-height:clamp(64px,13vw,108px);padding:6px 4px;display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left;font-weight:500}
.cell .n{font-size:14px;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.cell.out .n{color:var(--mute);opacity:.6}.cell.today .n{background:var(--red);color:var(--on)}
.cell.sel{background:color-mix(in srgb,var(--red) 9%,var(--bg))}
.chip{font-size:12px;line-height:1.3;padding:2px 5px;border-radius:5px;color:var(--on);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}
.more{font-size:12px;color:var(--mute);padding-left:4px}
.dots{display:none;gap:3px;padding-left:6px}.dots i{width:6px;height:6px;border-radius:50%}

.tl{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tlh{display:grid;border-bottom:1px solid var(--line);background:var(--panel)}

.tlh div b{display:block;font:700 20px/1.1 Archivo,Inter,sans-serif;color:var(--ink)}
.tlh div.today b{color:var(--red)}
.tlb{height:min(64vh,620px);overflow-y:auto;position:relative}
.tlg{display:grid;position:relative}
.hr{height:56px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mute);padding:2px 6px;text-align:right;font-variant-numeric:tabular-nums}
.col{position:relative;border-left:1px solid var(--line)}
.slot{height:56px;border-bottom:1px solid var(--line);display:block;width:100%;border-radius:0;background:none;border-top:0;border-left:0;border-right:0;min-height:0;padding:0}
.blk{position:absolute;border-radius:8px;padding:4px 6px;color:var(--on);font-size:12px;line-height:1.25;overflow:hidden;text-align:left;border:0;min-height:0;font-weight:600}
.blk span{display:block;font-weight:400;opacity:.9}
.blk.drag,.chip.drag{pointer-events:none;opacity:.9;box-shadow:0 8px 20px rgba(0,0,0,.3);z-index:6;outline:2px solid var(--ink)}
.rz{position:absolute;left:0;right:0;bottom:0;height:10px;cursor:ns-resize}.rz::after{content:"";position:absolute;left:50%;bottom:3px;width:18px;height:3px;margin-left:-9px;border-radius:2px;background:rgba(255,255,255,.7)}
.ghost{position:absolute;left:2px;right:2px;border-radius:8px;background:color-mix(in srgb,var(--red) 30%,transparent);border:2px dashed var(--red);z-index:4;pointer-events:none;font-size:12px;font-weight:600;padding:2px 6px}
.cell.drop{outline:2px dashed var(--red);outline-offset:-3px}
.tlb,.grid{touch-action:pan-y}body.dragging{user-select:none;-webkit-user-select:none}
.now{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:3}.now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--red)}
.list h3{font:700 18px/1.2 Archivo,Inter,sans-serif;margin:16px 0 6px;text-transform:capitalize}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));width:60px;height:60px;border-radius:18px;background:var(--red);color:var(--on);border:0;font-size:30px;font-weight:500;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:20}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:30}
.modal.on{display:flex}

.form{background:var(--bg);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;border:1px solid var(--line)}
@media(min-width:700px){.form{border-radius:20px}}
.form h2{font:800 24px/1.1 Archivo,Inter,sans-serif;margin:0 0 10px}
.form label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
.form input,.form textarea,.form select{width:100%;min-height:44px;font-size:16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:8px 12px}
.form textarea{min-height:80px;resize:vertical}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.colors{display:flex;gap:10px;flex-wrap:wrap}.colors button{width:36px;height:36px;min-height:0;padding:0;border-radius:50%;border:3px solid transparent}.colors button.on{border-color:var(--ink)}
.chk{display:flex!important;align-items:center;gap:10px;color:var(--ink)!important;font-size:15px!important;min-height:44px;margin:6px 0 0!important}
.chk input{width:22px;height:22px;min-height:0;accent-color:var(--red)}
.acts{display:flex;gap:8px;margin-top:16px}.acts button{flex:1}
.go{background:var(--red);color:var(--on);border-color:var(--red)}
.del{color:var(--red)}
.note{font-size:13px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:40;font-weight:600;display:none}
@media(prefers-reduced-motion:no-preference){.sheet .face{animation:tear .35s ease-out}@keyframes tear{from{transform:translateY(-6px);opacity:.4}to{transform:none;opacity:1}}}
</style>
</head>

  for(let i=0;i<60&&list.length<300;i++){const k=add(T,i);for(const e of on(k)){if(e.off==null||e.off<0)continue;const tm=e.allDay?'09:00':e.start;const at=+new Date(k+'T'+tm+':00')-e.off*60000;if(at<=now)continue;
    const when=e.off===0?t('Daba ⏰'):e.off===1440?t('Ghedda ⏰'):e.off===60?t('F 1 sa3a ⏰'):(LANG==='en'?'In '+e.off+' min ⏰':LANG==='fr'?'Dans '+e.off+' min ⏰':'F '+e.off+' d9aye9 ⏰');
    list.push({id:'m-'+e.id+'-'+k,at,title:e.title+' · '+(e.allDay?t('Nhar kaml'):fmtT(e.start)),body:(e.desc?e.desc.split('\n')[0].slice(0,80)+' · ':'')+when,daily:false,alarm:!!e.alarm})}}
  try{DftarAndroid.setReminders(JSON.stringify(list))}catch(err){}},600)}
function accForm(){const f=document.getElementById('accf'),ago=st.last?new Date(st.last).toLocaleTimeString(LOC,{hour:'2-digit',minute:'2-digit'}):'—';
  f.innerHTML=AUTH?`<h2 id="a-h">${t('Compte')}</h2><div class="note">${t('Dakhel b')}</div><div style="font-weight:600;overflow-wrap:anywhere">${esc(AUTH.email||'')}</div>
    <div class="note" style="margin-top:8px">${t('Akhir sync:')} <b>${ago}</b> · ${st.s==='err'?esc(st.msg):st.s==='offline'?t('Bla internet'):st.s==='busy'?'…':'✓'}</div>
    <div class="acts"><button type="button" id="a-sync" class="go">${t('Sync daba')}</button><button type="button" id="a-out">${t('Khrej')}</button></div><button type="button" id="a-close" style="width:100%;margin-top:8px">${t('Sdd')}</button>`
  :`<h2 id="a-h">${t('Compte')}</h2><div class="note">${t('Dkhol bach tl9a mawa3id dialek f telephone w PC. Nafs l-compte dial Dftar khdam hna.')}</div>
    <label for="a-em">Email</label><input id="a-em" type="email" autocomplete="email" required><label for="a-pw">${t('Mot de passe (6 7orouf wla ktar)')}</label><input id="a-pw" type="password" autocomplete="current-password" minlength="6" required>
    ${st.msg?`<div class="note" style="color:var(--red);margin-top:8px">${esc(st.msg)}</div>`:''}
    <div class="acts"><button class="go">${t('Dkhol')}</button><button type="button" id="a-up">${t('Créer compte')}</button></div><button type="button" id="a-close" style="width:100%;margin-top:8px">${t('Sdd')}</button>`}
async function login(up){const em=document.getElementById('a-em').value.trim(),pw=document.getElementById('a-pw').value;if(!em||pw.length<6){st.msg=t('Mot de passe (6 7orouf wla ktar)');return accForm()}
  try{const j=up?await sbAuth('signup',{email:em,password:pw}):await sbAuth('token?grant_type=password',{email:em,password:pw});if(!j.access_token){st.msg=t('Chouf email dialek w confirmi');return accForm()}
    keepAuth(j);st.msg='';st.s='idle';accForm();await doSync();toast(t('Dkhelti ✓'))}
  catch(e){st.msg=/invalid/i.test(e.message)?t('Email wla mot de passe ghalet'):/already/i.test(e.message)?t('Had l-email 3ndo compte, dir Dkhol'):e.message;accForm()}}
let view='month',cur=T,sel=T,editing=null,color='c2',scrolled=false;
const occurs=(e,k)=>{if((e.ex||[]).includes(k))return false;if(e.date===k)return true;if(!e.rep||k<e.date)return false;
  const a=pk(e.date),b=pk(k);if(e.rep==='day')return true;if(e.rep==='wd'){const w=b.getDay();return w>0&&w<6}
  if(e.rep==='week')return a.getDay()===b.getDay();if(e.rep==='month')return a.getDate()===b.getDate();if(e.rep==='year')return a.getDate()===b.getDate()&&a.getMonth()===b.getMonth();return false};
const on=k=>E.filter(e=>occurs(e,k)).sort((x,y)=>(x.allDay?0:1)-(y.allDay?0:1)||(x.start||'').localeCompare(y.start||''));
const mins=t=>{const[h,m]=(t||'0:0').split(':').map(Number);return h*60+m};
const fmtT=t=>t?t.replace(/^0/,''):'';
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const evRow=(e,k)=>`<button class="ev" data-e="${e.id}" data-k="${k}"><i class="bar" style="background:var(--${e.color||'c2'})"></i><span><b>${esc(e.title)}</b>${e.desc?`<small>${esc(e.desc)}</small>`:''}</span><span class="tm">${e.allDay?t('Nhar kaml'):fmtT(e.start)+'<br>'+fmtT(e.end)}${e.rep?' ↻':''}</span></button>`;
function renderSheet(){const d=pk(sel),list=on(sel);
  document.getElementById('sheet').innerHTML=`<div class="holes"><i></i><i></i><i></i></div><div class="top"><span>${cap(d.toLocaleDateString(LOC,{month:'long'}))} ${d.getFullYear()}</span><span>${sel===T?t('Lyoum'):''}</span></div>
  <div class="face"><div class="bignum">${d.getDate()}</div><div><div class="wd">${cap(d.toLocaleDateString(LOC,{weekday:'long'}))}</div><div class="mo">${list.length?list.length+' '+t('maw3id'):t('Nhar khawi')}</div></div></div>
  <div class="agenda">${list.length?list.map(e=>evRow(e,sel)).join(''):`<div class="empty">${t('Ma kayn walou. Tbe3 3la + bach tzid maw3id.')}</div>`}</div>`}
function renderMonth(){const d=pk(cur),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7;
  const days=[...Array(42)].map((_,i)=>dk(new Date(y,m,1-start+i)));const wk=[...Array(7)].map((_,i)=>new Date(2024,0,1+i).toLocaleDateString(LOC,{weekday:'short'}).replace('.',''));
  return`<div class="grid">${wk.map(w=>`<div class="dow">${w}</div>`).join('')}${days.map(k=>{const L=on(k),dd=pk(k);
    return`<button class="cell ${dd.getMonth()!==m?'out':''} ${k===T?'today':''} ${k===sel?'sel':''}" data-sel="${k}" aria-label="${dd.toLocaleDateString(LOC,{day:'numeric',month:'long'})}, ${L.length} maw3id"><span class="n">${dd.getDate()}</span>${L.slice(0,3).map(e=>`<span class="chip" data-chip="${e.id}" data-k="${k}" style="background:var(--${e.color||'c2'})">${e.allDay?'':fmtT(e.start)+' '}${esc(e.title)}</span>`).join('')}${L.length>3?`<span class="more">+${L.length-3}</span>`:''}<span class="dots">${L.slice(0,4).map(e=>`<i style="background:var(--${e.color||'c2'})"></i>`).join('')}</span></button>`}).join('')}</div>`}
function layout(list){const cols=[];const out=list.filter(e=>!e.allDay).map(e=>{const s=mins(e.start),en=Math.max(mins(e.end||e.start),s+30);let c=0;while(cols[c]&&cols[c]>s)c++;cols[c]=en;return{e,s,en,c}});const n=Math.max(1,cols.length);return out.map(o=>({...o,n}))}
function renderTime(keys){const H=56,cw=`52px repeat(${keys.length},minmax(0,1fr))`;const nowM=(()=>{const d=new Date();return d.getHours()*60+d.getMinutes()})();
  const allday=keys.map(k=>on(k).filter(e=>e.allDay));
  return`<div class="tl"><div class="tlh" style="grid-template-columns:${cw}"><div></div>${keys.map(k=>{const d=pk(k);return`<div class="${k===T?'today':''}">${d.toLocaleDateString(LOC,{weekday:'short'}).replace('.','')}<b>${d.getDate()}</b></div>`}).join('')}</div>
  ${allday.some(a=>a.length)?`<div class="tlh" style="grid-template-columns:${cw}"><div style="font-size:11px">${t('Nhar kaml')}</div>${allday.map((a,i)=>`<div style="padding:4px">${a.map(e=>`<button class="blk" style="position:static;display:block;width:100%;background:var(--${e.color})" data-e="${e.id}" data-k="${keys[i]}">${esc(e.title)}</button>`).join('')}</div>`).join('')}</div>`:''}
  <div class="tlb" id="tlb"><div class="tlg" style="grid-template-columns:${cw}"><div>${[...Array(24)].map((_,h)=>`<div class="hr">${h?pad(h)+':00':''}</div>`).join('')}</div>
  ${keys.map(k=>`<div class="col" data-col="${k}">${[...Array(24)].map((_,h)=>`<button class="slot" data-slot="${k}|${pad(h)}:00" aria-label="${t('Zid maw3id')} ${pad(h)}:00"></button>`).join('')}
   ${layout(on(k)).map(o=>`<button class="blk" data-e="${o.e.id}" data-k="${k}" style="top:${o.s/60*H+1}px;height:${(o.en-o.s)/60*H-2}px;left:calc(${o.c/o.n*100}% + 2px);width:calc(${100/o.n}% - 4px);background:var(--${o.e.color||'c2'})">${esc(o.e.title)}<span>${fmtT(o.e.start)}–${fmtT(o.e.end)}</span><i class="rz" aria-hidden="true"></i></button>`).join('')}
   ${k===T?`<div class="now" style="top:${nowM/60*H}px"></div>`:''}</div>`).join('')}</div></div></div>`}
function renderList(){let out='';for(let i=0;i<45;i++){const k=add(sel,i),L=on(k);if(!L.length)continue;const d=pk(k);out+=`<h3>${k===T?t('Lyoum · '):''}${d.toLocaleDateString(LOC,{weekday:'long',day:'numeric',month:'long'})}</h3><div class="agenda" style="padding:0">${L.map(e=>evRow(e,k)).join('')}</div>`}
  return`<div class="list">${out||`<div class="empty">${t('Ma kayn ta maw3id f 45 yom jayin.')}</div>`}</div>`}
function render(){const d=pk(cur);const ti=document.getElementById('title');
  if(view==='month')ti.textContent=d.toLocaleDateString(LOC,{month:'long',year:'numeric'});
  else if(view==='week'){const mon=add(cur,-((d.getDay()+6)%7)),sun=add(mon,6);ti.textContent=pk(mon).getDate()+' – '+pk(sun).toLocaleDateString(LOC,{day:'numeric',month:'short'})}
  else if(view==='day')ti.textContent=d.toLocaleDateString(LOC,{weekday:'long',day:'numeric',month:'long'});
  else ti.textContent=t('Mawa3id jayin');
  const v=document.getElementById('view'),otb=document.getElementById('tlb'),keep=otb&&scrolled?otb.scrollTop:null;
  if(view==='month')v.innerHTML=renderMonth();
  else if(view==='week'){const mon=add(cur,-((d.getDay()+6)%7));v.innerHTML=renderTime([...Array(7)].map((_,i)=>add(mon,i)))}
  else if(view==='day')v.innerHTML=renderTime([cur]);else v.innerHTML=renderList();
  const tb=document.getElementById('tlb');if(tb){if(keep!=null)tb.scrollTop=keep;else if(!scrolled){tb.scrollTop=7*56}scrolled=true}
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));renderSheet()}
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>el.style.display='none',2200)}
const $=id=>document.getElementById(id);
function drawColors(){$('f-col').innerHTML=COLORS.map(c=>`<button type="button" data-c="${c}" class="${c===color?'on':''}" style="background:var(--${c})" aria-label="Lon ${c}"></button>`).join('')}
function openForm(e,k,time,endT){editing=e||null;$('f-h').textContent=e?t('Bddel l-maw3id'):t('Maw3id jdid');$('f-t').value=e?e.title:'';$('f-d').value=e?e.desc||'':'';
  $('f-date').value=e?e.date:(k||sel);$('f-all').checked=!!(e&&e.allDay);$('f-s').value=e?e.start||'09:00':(time||'09:00');
  $('f-e').value=e?e.end||'10:00':(endT||(time?pad(Math.min(23,+time.slice(0,2)+1))+':'+time.slice(3):'10:00'));$('f-rep').value=e?e.rep||'':'';$('f-off').value=String(e&&e.off!=null?e.off:15);$('f-alarm').checked=!!(e&&e.alarm);
  color=e?e.color||'c2':'c2';drawColors();$('f-times').style.display=$('f-all').checked?'none':'';$('f-del').style.display=e?'':'none';$('modal').classList.add('on');setTimeout(()=>$('f-t').focus(),50)}
const closeForm=()=>{$('modal').classList.remove('on');editing=null};
$('form').addEventListener('submit',ev=>{ev.preventDefault();const o=editing||{id:uid()};o.title=$('f-t').value.trim();if(!o.title)return;o.desc=$('f-d').value.trim();o.date=$('f-date').value||sel;
  o.allDay=$('f-all').checked;o.start=o.allDay?null:$('f-s').value;o.end=o.allDay?null:$('f-e').value;if(!o.allDay&&o.end&&o.end<=o.start)o.end=pad(Math.min(23,+o.start.slice(0,2)+1))+':'+o.start.slice(3);
  o.rep=$('f-rep').value;o.off=+$('f-off').value;if(o.off>=0&&window.DftarAndroid&&DftarAndroid.askNotif)DftarAndroid.askNotif();o.alarm=$('f-alarm').checked;o.color=color;if(!editing)E.push(o);save();sel=o.date;cur=o.date;closeForm();render();toast(editing?t('Tbeddel ✓'):t('Tzad ✓'))});
$('f-all').addEventListener('change',()=>{$('f-times').style.display=$('f-all').checked?'none':''});
$('f-cancel').onclick=closeForm;$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeForm()});
$('f-col').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(b){color=b.dataset.c;drawColors()}});
$('f-del').onclick=()=>{if(!editing)return;E=E.filter(x=>x!==editing);save();closeForm();render();toast(t('Tmss7 ✓'))};
$('add').onclick=()=>openForm(null,sel);
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;view=b.dataset.v;if(view!=='month')cur=sel;scrolled=false;render()});
const step=dir=>{const d=pk(cur);if(view==='month'){d.setDate(1);d.setMonth(d.getMonth()+dir)}else if(view==='week')d.setDate(d.getDate()+7*dir);else d.setDate(d.getDate()+dir*(view==='list'?7:1));cur=dk(d);if(view!=='month')sel=cur;render()};
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('today').onclick=()=>{cur=sel=T;scrolled=false;render()};
document.body.addEventListener('click',e=>{if(justDragged){e.preventDefault();e.stopPropagation();return}const b=e.target.closest('[data-sel],[data-e],[data-slot]');if(!b||b.closest('#modal'))return;
  if(b.dataset.sel){sel=b.dataset.sel;render();if(innerWidth<900)document.getElementById('sheet').scrollIntoView({behavior:'smooth',block:'start'})}
  else if(b.dataset.e){const ev=E.find(x=>x.id===b.dataset.e);if(ev)openForm(ev)}
  else if(b.dataset.slot){const[k,t]=b.dataset.slot.split('|');openForm(null,k,t)}});
const H=56,SNAP=15,toT=m=>{m=Math.max(0,Math.min(1439,Math.round(m)));return pad(Math.floor(m/60))+':'+pad(m%60)};
let D=null,justDragged=false;
function moveEvent(ev,fromK,toK,start,end){if(ev.rep){ev.ex=[...(ev.ex||[]),fromK];const c={...ev,id:uid(),rep:'',ex:[],date:toK};if(start!==undefined){c.start=start;c.end=end}E.push(c)}
  else{ev.date=toK;if(start!==undefined){ev.start=start;ev.end=end}}save();sel=toK;if(view==='month'&&pk(toK).getMonth()!==pk(cur).getMonth())cur=toK;render();toast(ev.rep?t('Tbeddel ghir had l-merra ✓'):t('Tbeddel ✓'))}
function startD(e,o){D={...o,x0:e.clientX,y0:e.clientY,id:e.pointerId,active:false,touch:e.pointerType!=='mouse'};
  if(D.touch)D.timer=setTimeout(()=>{if(D){activate();try{navigator.vibrate&&navigator.vibrate(25)}catch(err){}}},380)}
function activate(){D.active=true;document.body.classList.add('dragging');if(D.el)D.el.classList.add('drag');
  if(D.kind==='create'){const g=document.createElement('div');g.className='ghost';D.col.appendChild(g);D.ghost=g}}
$('view').addEventListener('pointerdown',e=>{if(e.button>0)return;const rz=e.target.closest('.rz'),blk=e.target.closest('.blk[data-e]'),chip=e.target.closest('.chip[data-chip]'),col=e.target.closest('.col');
  if(blk&&!blk.closest('.tlh')){const ev=E.find(x=>x.id===blk.dataset.e);if(!ev||ev.allDay)return;const s=mins(ev.start),en=Math.max(mins(ev.end||ev.start),s+15);
    startD(e,{kind:rz?'resize':'move',el:blk,ev,k:blk.dataset.k,s,en,ns:s,ne:en,nk:blk.dataset.k})}
  else if(chip){const ev=E.find(x=>x.id===chip.dataset.chip);if(ev)startD(e,{kind:'mday',el:chip,ev,k:chip.dataset.k,nk:chip.dataset.k})}
  else if(col&&e.pointerType==='mouse'){const r=col.getBoundingClientRect(),m=Math.floor((e.clientY-r.top)/H*60/SNAP)*SNAP;startD(e,{kind:'create',col,k:col.dataset.col,s:m,ne:m+60})}});
window.addEventListener('pointermove',e=>{if(!D||e.pointerId!==D.id)return;const dx=e.clientX-D.x0,dy=e.clientY-D.y0;
  if(!D.active){if(D.touch){if(Math.hypot(dx,dy)>8){clearTimeout(D.timer);D=null}return}if(Math.hypot(dx,dy)>5)activate();else return}
  const dm=Math.round(dy/H*60/SNAP)*SNAP;
  if(D.kind==='move'){const dur=D.en-D.s;D.ns=Math.max(0,Math.min(1440-dur,D.s+dm));D.ne=D.ns+dur;
    const hit=document.elementsFromPoint(e.clientX,e.clientY).map(x=>x.closest&&x.closest('.col')).find(Boolean);if(hit&&hit!==D.el.parentElement){hit.appendChild(D.el);D.el.style.left='2px';D.el.style.width='calc(100% - 4px)'}
    if(hit)D.nk=hit.dataset.col;D.el.style.top=(D.ns/60*H+1)+'px';D.el.querySelector('span').textContent=toT(D.ns)+'–'+toT(D.ne)}
  else if(D.kind==='resize'){D.ne=Math.max(D.s+SNAP,Math.min(1440,D.en+dm));D.el.style.height=((D.ne-D.s)/60*H-2)+'px';D.el.querySelector('span').textContent=toT(D.s)+'–'+toT(D.ne)}
  else if(D.kind==='create'){const r=D.col.getBoundingClientRect(),m=Math.ceil((e.clientY-r.top)/H*60/SNAP)*SNAP;D.ne=Math.max(D.s+SNAP,Math.min(1440,m));D.ghost.style.top=(D.s/60*H)+'px';D.ghost.style.height=((D.ne-D.s)/60*H)+'px';D.ghost.textContent=toT(D.s)+'–'+toT(D.ne)}
  else if(D.kind==='mday'){D.el.style.transform=`translate(${dx}px,${dy}px)`;document.querySelectorAll('.cell.drop').forEach(c=>c.classList.remove('drop'));
    const hit=document.elementsFromPoint(e.clientX,e.clientY).map(x=>x.closest&&x.closest('.cell')).find(Boolean);if(hit){hit.classList.add('drop');D.nk=hit.dataset.sel}}});
document.addEventListener('touchmove',e=>{if(D&&D.active)e.preventDefault()},{passive:false});
const endD=e=>{if(!D||(e&&e.pointerId!==D.id))return;clearTimeout(D.timer);const d=D;D=null;document.body.classList.remove('dragging');if(!d.active)return;justDragged=true;setTimeout(()=>justDragged=false,350);
  if(d.kind==='move'){if(d.nk!==d.k||d.ns!==d.s)moveEvent(d.ev,d.k,d.nk,toT(d.ns),toT(d.ne));else render()}
  else if(d.kind==='resize'){if(d.ne!==d.en)moveEvent(d.ev,d.k,d.k,toT(d.s),toT(d.ne));else render()}
  else if(d.kind==='create'){d.ghost.remove();openForm(null,d.k,toT(d.s),toT(d.ne))}
  else if(d.kind==='mday'){if(d.nk&&d.nk!==d.k)moveEvent(d.ev,d.k,d.nk);else render()}};
window.addEventListener('pointerup',endD);window.addEventListener('pointercancel',e=>{if(D&&!D.active){clearTimeout(D.timer);D=null}});
let tx=null;$('view').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('view').addEventListener('touchend',e=>{if(tx==null||justDragged||document.body.classList.contains('dragging')){tx=null;return}const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>70&&view!=='list')step(dx<0?1:-1);tx=null});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeForm()});
$('acc-btn').onclick=()=>{accForm();$('accm').classList.add('on')};
$('accm').addEventListener('click',e=>{if(e.target.id==='accm'||e.target.id==='a-close')$('accm').classList.remove('on');else if(e.target.id==='a-up')login(true);else if(e.target.id==='a-sync')doSync();
  else if(e.target.id==='a-out'){setAuth(null);st.s='off';st.last=0;setSt('off');accForm();toast(t('Khrejti'))}});
$('accf').addEventListener('submit',e=>{e.preventDefault();login(false)});
window.addEventListener('online',doSync);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')doSync()});setInterval(()=>{if(document.visibilityState!=='hidden')doSync()},60000);
setTimeout(doSync,800);syncRem();setSt(st.s);
$('lang').value=LANG;$('lang').onchange=e=>{try{localStorage.setItem('maw3id-lang',e.target.value)}catch(err){}location.reload()};
render();
}
