<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dftar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: personal, direct, motivating — a pocket carnet
   IDEA: a squared school notebook with tabs and stamps
   PICTURE: the working tracker itself: habit grid + project progress
   COLOUR/TYPE: white paper, ink, coral stamp accent, deep green for growth; Outfit + Inter
   LAYOUT: one column, max 720px, bottom tab bar on phone */
:root{color-scheme:dark;
--bg:#121413;--paper:#1c1f1d;--line:#2c312e;
--ink:#eef1ec;--mute:#a2aaa4;
--grow:#4fc58f;--hot:#ff6e55;--on:#fff}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;padding-bottom:88px}
h1,h2,h3{font-family:Outfit,Inter,sans-serif;margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:34px}h2{font-size:22px}h3{font-size:17px}
.wrap{max-width:720px;margin:0 auto;padding:20px max(4vw,16px)}
.top{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:8px 0 18px}
.sub{color:var(--mute);font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px max(4vw,16px) calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);z-index:5}
nav button{flex:1;max-width:340px;margin:0 auto}
button{font:inherit;font-weight:600;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:0 14px;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
button.act{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.go{background:var(--grow);color:var(--on);border-color:var(--grow)}
button.x{min-height:36px;min-width:36px;padding:0;background:none;border:0;color:var(--mute);font-size:20px}
input,textarea{font:inherit;font-size:16px;width:100%;min-height:44px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:64px;resize:vertical}
form.add{display:flex;gap:8px;margin:12px 0}
form.add input{flex:1}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;grid-column:1/-1}
.day{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;font-weight:500}
.day b{font-size:14px;color:var(--ink)}
.day.on{background:var(--grow);border-color:var(--grow);color:var(--on)}.day.on b{color:var(--on)}
.day.today{border:2px solid var(--ink)}
.streak{font-size:13px;color:var(--mute)}.streak b{color:var(--hot);font-size:16px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--grow);border-radius:99px;transition:width .4s}
.pct{font-family:Outfit,sans-serif;font-weight:700;font-size:44px;line-height:1}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--mute)}
.late{color:var(--hot);font-weight:600}
.alert{border-radius:16px;padding:14px 16px;margin:12px 0;font-weight:600;background:var(--hot);color:var(--on)}
.alert.ok{background:var(--grow)}
.proj{cursor:pointer;width:100%;text-align:left;display:block;font-weight:400;padding:14px;min-height:0}
.sec{margin-top:22px}.sec h3{display:flex;justify-content:space-between;align-items:center}
.count{font-size:13px;color:var(--mute);font-family:Inter}
.item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{flex:1;overflow-wrap:anywhere;padding-top:6px}
.done .t{text-decoration:line-through;color:var(--mute)}
.chk{width:28px;height:28px;min-height:28px;border-radius:8px;border:2px solid var(--grow);background:none;padding:0;margin-top:2px;flex:none;color:var(--on);font-size:15px}
.done .chk{background:var(--grow)}
.prob{padding:10px 0;border-bottom:1px solid var(--line)}.prob:last-child{border-bottom:0}
.prob .p{font-weight:600;display:flex;gap:8px;justify-content:space-between}
.prob label{font-size:13px;color:var(--mute);display:block;margin:6px 0 4px}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
@media(max-width:600px){.grid2{grid-template-columns:minmax(0,1fr)}h1{font-size:30px}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;border-radius:12px;display:flex;gap:10px;align-items:center;z-index:9}
.toast button{min-height:36px;background:var(--hot);color:var(--on);border:0}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.mhead h2{text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{font-size:12px;color:var(--mute);text-align:center;padding:2px 0}
.cd{min-height:52px;padding:4px 2px;border-radius:10px;background:var(--bg);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;font-weight:600}
.cd.out{visibility:hidden}
.cd.today{border:2px solid var(--ink)}
.cd.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cd.dl{box-shadow:inset 0 -3px 0 var(--hot)}
.dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:100%}
.dots i{width:6px;height:6px;border-radius:9px;background:var(--mute)}.dots i.ok{background:var(--grow)}
.cd.sel .dots i{background:var(--bg)}.cd.sel .dots i.ok{background:var(--grow)}
.tag{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.tag.h{color:var(--grow)}.tag.s{color:var(--hot)}
.pk{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;text-align:left;font-weight:500;margin:6px 0;background:var(--bg)}
.pk span{overflow-wrap:anywhere;padding:8px 0}.pk b{color:var(--grow);font-size:20px}
.pg{font-size:13px;color:var(--mute);margin:14px 0 2px;font-weight:600}
.dlnote{color:var(--hot);font-weight:600;font-size:14px;margin:6px 0}
nav{gap:6px}nav button{padding:0 6px;font-size:14px}
select{font:inherit;font-size:16px;width:100%;min-height:44px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.calhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{font-size:12px;color:var(--mute);text-align:center;padding-bottom:2px}
.cell{min-height:52px;padding:6px 0 4px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;font-weight:500;background:var(--bg)}
.cell.out{opacity:.35}.cell.today{border:2px solid var(--grow)}
.cell.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dots{display:flex;gap:3px;margin-top:5px;height:6px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--grow)}.dots i.dl{background:var(--hot)}
.tag{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.kind{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--ink);white-space:nowrap;margin-top:6px}
.kind.dl{background:var(--hot);color:var(--on)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;margin-top:8px}
.th{position:relative;padding:0;min-height:0;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--bg);display:block;width:100%}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.thx{position:absolute;top:3px;right:3px;min-height:28px;width:28px;padding:0;border-radius:99px;background:rgba(0,0,0,.65);color:#fff;border:0;font-size:16px}
.addimg{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border-radius:12px;border:1px dashed var(--mute);margin-top:8px;cursor:pointer;font-weight:600}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:20;padding:12px}#lb.on{display:flex}#lb img{max-width:100%;max-height:100%;border-radius:8px}
@media(min-width:900px){
  body{padding-bottom:0;padding-left:232px}
  nav{top:0;bottom:0;right:auto;width:232px;flex-direction:column;justify-content:flex-start;align-items:stretch;border-top:0;border-right:1px solid var(--line);padding:28px 16px;gap:6px}
  nav::before{content:'Dftar';font:700 28px/1 Outfit,Inter,sans-serif;color:var(--ink);margin:0 10px 22px}
  nav button{flex:none;max-width:none;width:100%;margin:0;text-align:left;padding:0 16px;font-size:16px;min-height:46px;border-color:transparent;background:none}
  nav button.act{background:var(--ink);color:var(--bg)}
  nav button:not(.act):hover{background:var(--paper)}
  .wrap{max-width:1120px;padding:36px 48px}
  h1{font-size:40px}
  .toast{bottom:28px;left:calc(50% + 116px)}
  .hlist,.plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
  .hlist .card,.plist .card{margin:0}
  #nlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;align-items:start}
  #nlist .card{margin:0}
  .calsplit{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:36px;align-items:start}
  .calR .sec{margin-top:0}.cell{min-height:78px}
  .calR{position:sticky;top:24px}
}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

function importPlan(raw){let d;try{d=JSON.parse(raw.slice(raw.indexOf('{'),raw.lastIndexOf('}')+1))}catch(e){return'Code ghalet. Copy l-code kaml mn Claude.'}
  const list=d.projects||(d.project?[d.project]:[]),hs=Array.isArray(d.habits)?d.habits:[];

  let hn=0;for(const name of hs){const nm=String(name||'').trim();if(nm&&!S.habits.some(x=>norm(x.name)===norm(nm))){S.habits.push({id:uid(),name:nm,days:{},created:todayK()});hn++}}

function importOne(P){
  let p=S.projects.find(x=>norm(x.name)===norm(P.name));
  if(!p){p={id:uid(),name:P.name,goal:'',deadline:'',type:'solo',members:[],tasks:[],problems:[],results:[]};S.projects.unshift(p)}
  if(P.goal)p.goal=P.goal;if(P.deadline)p.deadline=P.deadline;if(P.type)p.type=P.type;
  p.members=p.members||[];for(const m of P.members||[])if(m&&m!=='Ana'&&!p.members.includes(m))p.members.push(m);
  for(const c of P.check||[]){const t=p.tasks.find(x=>norm(x.t).includes(norm(c))||norm(c).includes(norm(x.t)));if(t)t.done=1}
  let n=0;for(const T of P.tasks||[]){let t=p.tasks.find(x=>norm(x.t)===norm(T.t));
    if(!t){t={id:uid(),t:T.t,done:T.done?1:0,who:T.who==='Ana'?'':(T.who||'')};p.tasks.push(t);n++}
    if(T.date){const arr=S.plan[T.date]||(S.plan[T.date]=[]);if(!arr.some(x=>x.type==='task'&&x.tid===t.id))arr.push({id:uid(),type:'task',pid:p.id,tid:t.id})}}
  for(const Q of P.problems||[]){if(!p.problems.some(x=>norm(x.p)===norm(Q.p)))p.problems.push({id:uid(),p:Q.p,s:Q.s||''})}
  for(const R of P.results||[]){if(!p.results.some(x=>norm(x.t)===norm(R)))p.results.push({id:uid(),t:R})}
  return{n,p};}

  if(f.id==='f-habit'){const v=document.getElementById('i-habit').value.trim();if(v){S.habits.push({id:uid(),name:v,days:{},created:todayK()});save();render()}}
  else if(f.id==='f-member'){const p=cur(),v=document.getElementById('i-member').value.trim();if(p&&v&&v!=='Ana'&&!(p.members||[]).includes(v)){(p.members||(p.members=[])).push(v);save();render()}}
  else if(f.id==='f-proj'){const n=document.getElementById('i-pname').value.trim();if(!n)return;
    const p={id:uid(),name:n,goal:document.getElementById('i-pgoal').value.trim(),deadline:document.getElementById('i-pdl').value,type:document.getElementById('i-ptype').value,members:[],tasks:[],problems:[],results:[]};
    S.projects.unshift(p);save();view.pid=p.id;render();scrollTo(0,0)}
  else if(f.dataset.add){const p=cur(),v=f.querySelector('input').value.trim();if(!p||!v)return;
    const k=f.dataset.add;p[k].push(k==='tasks'?{id:uid(),t:v,done:0,who:(f.querySelector('select')||{}).value||''}:k==='problems'?{id:uid(),p:v,s:''}:{id:uid(),t:v});save();render();
    const nf=app.querySelector(`form[data-add="${k}"] input`);nf&&nf.focus()}
});
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.hd){const[id,k]=b.dataset.hd.split('|');const h=S.habits.find(x=>x.id===id);if(h){h.days[k]?delete h.days[k]:h.days[k]=1;save();render()}}
  else if(b.dataset.delHabit){snap();S.habits=S.habits.filter(x=>x.id!==b.dataset.delHabit);save();render();toast('Habit tmss7at')}
  else if(b.dataset.open){view.pid=b.dataset.open;render();scrollTo(0,0)}
  else if(b.id==='back'){view.pid=null;render();scrollTo(0,0)}
  else if(b.dataset.tog){const t=cur().tasks.find(x=>x.id===b.dataset.tog);t.done=t.done?0:1;save();render()}
  else if(b.dataset.rm){const[k,id]=b.dataset.rm.split('|');snap();const p=cur();p[k]=p[k].filter(x=>x.id!==id);save();render();toast('Tmss7at')}
  else if(b.dataset.ptype){cur().type=b.dataset.ptype;save();render()}
  else if(b.dataset.rmm){const p=cur();snap();p.members=p.members.filter(n=>n!==b.dataset.rmm);p.tasks.forEach(t=>{if(t.who===b.dataset.rmm)t.who=''});save();render();toast('T7iyed mn l-équipe')}
  else if(b.id==='del-proj'){snap();S.projects=S.projects.filter(x=>x.id!==view.pid);view.pid=null;save();render();toast('Projet tmss7')}
});
app.addEventListener('change',e=>{const el=e.target,p=cur();if(!p)return;
  if(el.dataset.f){p[el.dataset.f]=el.value.trim();save();render()}
  else if(el.dataset.sol){const x=p.problems.find(q=>q.id===el.dataset.sol);x.s=el.value.trim();save();render()}
});
render();trDom(document.body);
}
</script>
