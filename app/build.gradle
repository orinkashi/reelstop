plugins {
    id 'com.android.application'
}

android {
    namespace 'com.omar.dftar'
    compileSdk 34

    defaultConfig {
        applicationId 'com.omar.dftar'
        minSdk 24
        targetSdk 34
        versionCode 21
        versionName '3.3'
    }

    signingConfigs {
        debug {
            storeFile file('dftar.keystore')
            storePassword 'dftar123'
            keyAlias 'dftar'
            keyPassword 'dftar123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
