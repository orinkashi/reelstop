name: Build Nghma APK

on:
  push:
    branches: [nghma]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Nghma.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Nghma.apk
          path: Nghma.apk

      - name: Publish release (lien direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nghma-latest
          name: Nghma (dernière version)
          make_latest: false
          files: Nghma.apk
