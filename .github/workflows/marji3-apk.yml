name: Build Marji3 APK

on:
  push:
    paths: ['marji3/**', '.github/workflows/marji3-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marji3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Version
        run: echo "${{ github.run_number }}" > app/src/main/assets/version.txt

      - name: Signing key
        env:
          KS_B64: ${{ secrets.OMAR_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.OMAR_KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | tr -d ' \n\r\t' | base64 -d > "$RUNNER_TEMP/omar.jks"
            echo "key file size: $(wc -c < "$RUNNER_TEMP/omar.jks") bytes (expected 2628)"
            keytool -list -keystore "$RUNNER_TEMP/omar.jks" -storepass "$(printf '%s' "$KS_PASS" | tr -d ' \n\r\t')" -alias omar > /dev/null
            echo "OMAR_KS_PATH=$RUNNER_TEMP/omar.jks" >> "$GITHUB_ENV"
            echo "OMAR_KS_PASS=$(printf '%s' "$KS_PASS" | tr -d ' \n\r\t')" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secret: updates will not install over the old app"
          fi

      - name: Build
        run: gradle assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Marji3.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Marji3-apk
          path: marji3/Marji3.apk

      - name: Publish release (lien direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: marji3-latest
          name: Marji3 (dernière version)
          make_latest: false
          body: "v${{ github.run_number }}"
          files: marji3/Marji3.apk
