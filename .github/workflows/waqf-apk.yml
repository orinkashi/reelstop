name: Build Waqf APK

on:
  push:
    paths: ['waqf/**', '.github/workflows/waqf-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waqf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Signing key
        env:
          KS_B64: ${{ secrets.OMAR_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.OMAR_KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/omar.jks"
            echo "OMAR_KS_PATH=$RUNNER_TEMP/omar.jks" >> "$GITHUB_ENV"
            echo "OMAR_KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secret: updates will not install over the old app"
          fi

      - name: Build
        run: gradle assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Waqf.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Waqf-apk
          path: waqf/Waqf.apk

      - name: Publish release (lien direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: waqf-latest
          name: Waqf (dernière version)
          make_latest: false
          body: "v${{ github.run_number }}"
          files: waqf/Waqf.apk
